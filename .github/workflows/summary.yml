name: Summary Lab

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - name: Step one writes
        run: |
          echo "PATH IN STEP ONE: $GITHUB_STEP_SUMMARY"
          echo "## Hello from step one" >> $GITHUB_STEP_SUMMARY

      - name: Step two also writes
        run: echo "written by step two" >> $GITHUB_STEP_SUMMARY
