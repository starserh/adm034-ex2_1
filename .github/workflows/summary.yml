name: Summary Lab

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - name: Step one writes
        run: |
          echo "PATH IN STEP ONE: $GITHUB_STEP_SUMMARY"
          echo "## Hello from step one" >> $GITHUB_STEP_SUMMARY

      - name: Step two tries to read it
        run: |
          echo "PATH IN STEP TWO: $GITHUB_STEP_SUMMARY"
          echo "--- content ---"
          cat "$GITHUB_STEP_SUMMARY"
          echo "--- size in bytes: $(wc -c < "$GITHUB_STEP_SUMMARY") ---"

      - name: Step two also writes
        run: echo "written by step two" >> $GITHUB_STEP_SUMMARY

      - name: Step three overwrites its own file
        run: |
          echo "this line is written first" >> $GITHUB_STEP_SUMMARY
          echo "and this single-caret line replaced it" > $GITHUB_STEP_SUMMARY

  other_job:
    runs-on: ubuntu-latest
    steps:
      - name: Write from the other job
        run: echo "## This came from other_job" >> $GITHUB_STEP_SUMMARY

  fails_after_writing:
    runs-on: ubuntu-latest
    steps:
      - name: Write then fail
        run: |
          echo "## Written just before the step failed" >> $GITHUB_STEP_SUMMARY
          exit 1
