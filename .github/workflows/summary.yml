name: Summary Lab

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - name: Step one writes
        run: |
          echo "PATH IN STEP ONE: $GITHUB_STEP_SUMMARY"
          echo "## Hello from step one" >> $GITHUB_STEP_SUMMARY

      - name: Step two tries to read it
        run: |
          echo "PATH IN STEP TWO: $GITHUB_STEP_SUMMARY"
          echo "--- content ---"
          cat "$GITHUB_STEP_SUMMARY"
          echo "--- size in bytes: $(wc -c < "$GITHUB_STEP_SUMMARY") ---"

      - name: Step two also writes
        run: echo "written by step two" >> $GITHUB_STEP_SUMMARY

      - name: Step three overwrites its own file
        run: |
          echo "this line is written first" >> $GITHUB_STEP_SUMMARY
          echo "and this single-caret line replaced it" > $GITHUB_STEP_SUMMARY

  other_job:
    runs-on: ubuntu-latest
    steps:
      - name: Write from the other job
        run: echo "## This came from other_job" >> $GITHUB_STEP_SUMMARY

  too_big:
    runs-on: ubuntu-latest
    steps:
      - name: Write more than the limit
        run: |
          for i in $(seq 1 22000); do
            echo "line $i - padding padding padding padding padding" >> $GITHUB_STEP_SUMMARY
          done
          echo "BYTES WRITTEN: $(wc -c < $GITHUB_STEP_SUMMARY)"

  markdown_zoo:
    runs-on: ubuntu-latest
    steps:
      - name: Try every construct
        run: |
          {
            echo "## Table"
            echo "| a | b |"
            echo "|---|---|"
            echo "| 1 | 2 |"
            echo
            echo "## Code"
            echo '```python'
            echo "print('hi')"
            echo '```'
            echo
            echo "## Task list"
            echo "- [x] done"
            echo "- [ ] not done"
            echo
            echo "## Image from the internet"
            echo "![octocat](https://github.githubassets.com/images/modules/logos_page/Octocat.png)"
            echo
            echo "## Collapsible"
            echo "<details><summary>click me</summary>"
            echo
            echo "hidden content"
            echo "</details>"
            echo
            echo "## Raw HTML"
            echo "<b>bold via html</b> and <script>alert(1)</script>"
            echo
            echo "## Mermaid"
            echo '```mermaid'
            echo "graph LR; A-->B;"
            echo '```'
            echo
            echo "## Math"
            echo '$$e^{i\pi}+1=0$$'
            echo
            echo "## Emoji :rocket:"
          } >> $GITHUB_STEP_SUMMARY
